# AccesMed — backend + Postgres en el servidor (staging y prod).
#
# Es el mismo archivo para los dos entornos: lo que cambia vive en el `.env` de cada
# carpeta del servidor (plantilla: docker/deploy/.env.example).
#
#   /root/docker/accesmed/<entorno>/
#   ├── back/{docker-compose.yml, .env}   ← este archivo
#   ├── front/
#   └── postgres-data/                    ← datos de la Postgres (fuera de back/)
#
# El workflow .github/workflows/deploy.yml copia este archivo en cada deploy, así que
# NO se edita a mano en el servidor: los cambios se hacen acá y se versionan.
#
# Red `accesmed-<entorno>`: la comparten back y front del mismo entorno (y el nginx
# público cuando se configure). La Postgres queda solo en la red `internal`: no es
# alcanzable desde afuera del compose ni publica puertos.

services:
  db:
    image: postgres:16-alpine
    container_name: accesmed-${ACCESMED_ENV}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  back:
    image: ghcr.io/proyecto-final-grupo-17/accesmed-backend:${IMAGE_TAG}
    container_name: accesmed-${ACCESMED_ENV}-back
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${ACCESMED_ENV}
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      ACCESMED_JWT_SECRET: ${ACCESMED_JWT_SECRET}
      ACCESMED_SUPERADMIN_MAIL: ${ACCESMED_SUPERADMIN_MAIL}
      ACCESMED_SUPERADMIN_PASSWORD: ${ACCESMED_SUPERADMIN_PASSWORD}
      ACCESMED_CORS_ALLOWED_ORIGINS: ${ACCESMED_CORS_ALLOWED_ORIGINS}
      ACCESMED_FRONTEND_BASE_URL: ${ACCESMED_FRONTEND_BASE_URL}
      JAVA_OPTS: ${JAVA_OPTS}
      TZ: America/Argentina/Buenos_Aires
    mem_limit: ${BACK_MEM_LIMIT}
    ports:
      - "${BACK_PORT}:8080"
    networks:
      - internal
      - accesmed

networks:
  internal: {}
  accesmed:
    name: accesmed-${ACCESMED_ENV}
    external: true
