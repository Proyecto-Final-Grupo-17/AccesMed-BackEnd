# Spring Boot Docker Compose Service Connections está habilitado (ver spring.docker.compose
# abajo) y autoconfigura el DataSource leyendo el contenedor real cuando se corre la app
# (./mvnw spring-boot:run). El datasource se declara igual acá, con los MISMOS defaults que
# docker-compose.yml (accesmed/accesmed/5432), por si se corre sin Docker Compose Service
# Connections (ej. contra una Postgres ya levantada a mano). Los tests NO usan este perfil:
# levantan su propia Postgres efímera con Testcontainers (ver
# src/test/java/.../TestcontainersConfiguration.java), aislada de la BD de dev.
spring:
  docker:
    compose:
      file: docker/dev/docker-compose.yml
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:accesmed}
    username: ${POSTGRES_USER:accesmed}
    password: ${POSTGRES_PASSWORD:accesmed}
  jpa:
    show-sql: true
