# Perfil `staging`: corre en el servidor como contenedor Docker (ver Docs/DEPLOY.md).
# Todas las variables llegan por entorno desde el `.env` del servidor
# (/root/docker/accesmed/staging/back/.env), que arma docker/deploy/docker-compose.yml.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

accesmed:
  cors:
    allowed-origins: ${ACCESMED_CORS_ALLOWED_ORIGINS}
  # Base de los links que salen por mail (activación de cuenta, reseteo de contraseña).
  frontend:
    base-url: ${ACCESMED_FRONTEND_BASE_URL}
  # Los defaults de application.yml (cada 5 s) son para probar en dev; acá corren una vez
  # por minuto. Se pueden ajustar desde el `.env` sin rebuild.
  scheduler:
    recordar-confirmacion:
      cron: ${ACCESMED_SCHEDULER_RECORDAR_CONFIRMACION_CRON:0 * * * * *}
    confirmar-turnos-automaticamente:
      cron: ${ACCESMED_SCHEDULER_CONFIRMAR_TURNOS_CRON:0 * * * * *}
    vencer-validacion-turno:
      cron: ${ACCESMED_SCHEDULER_VENCER_VALIDACION_CRON:0 * * * * *}
    marcar-ausentes:
      cron: ${ACCESMED_SCHEDULER_MARCAR_AUSENTES_CRON:0 * * * * *}
