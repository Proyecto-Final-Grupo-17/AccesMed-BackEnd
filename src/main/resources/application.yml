spring:
  application:
    name: AccesMed-BackEnd
  # Secretos por archivo: las variables sin default (MAIL_USERNAME, MAIL_PASSWORD,
  # ACCESMED_JWT_SECRET) se leen de un `.env` en la raíz del proyecto, que NO se
  # versiona (está en .gitignore). `optional:` hace que el arranque no dependa del
  # archivo: en staging/prod las mismas variables llegan por entorno real y el
  # import se ignora. Una variable de entorno del shell le gana al `.env`.
  # Ver `.env.example` para la plantilla.
  config:
    import: optional:file:.env[.properties]
  # Locale fijo en español: los mensajes por defecto de Bean Validation (@NotNull, @Size,
  # etc.) salen en el idioma de la JVM; sin esto, en un servidor en inglés llegarían en
  # inglés al front.
  web:
    locale: es-AR
    locale-resolver: fixed
  liquibase:
    change-log: classpath:liquibase-db-changelogs/master.xml
  jpa:
    hibernate:
      ddl-auto: validate
    # OSIV apagado: en una API REST no hay vista que dispare lazy-loading fuera del
    # Service/App, y dejarlo prendido esconde N+1 detrás de una sesión abierta de más.
    open-in-view: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  # El health dice si la app está viva (lo usa el HEALTHCHECK del contenedor y el deploy).
  # Sin esto, Spring incluye el login al SMTP de Gmail: un corte de Gmail o una contraseña
  # faltante dejaría el contenedor `unhealthy`, y cada chequeo sería un login a Gmail.
  health:
    mail:
      enabled: false

accesmed:
  scheduler:
    recordar-confirmacion:
      cron: ${ACCESMED_SCHEDULER_RECORDAR_CONFIRMACION_CRON:*/5 * * * * *}
    confirmar-turnos-automaticamente:
      cron: ${ACCESMED_SCHEDULER_CONFIRMAR_TURNOS_CRON:*/5 * * * * *}
    vencer-validacion-turno:
      cron: ${ACCESMED_SCHEDULER_VENCER_VALIDACION_CRON:*/5 * * * * *}
    marcar-ausentes:
      cron: ${ACCESMED_SCHEDULER_MARCAR_AUSENTES_CRON:*/5 * * * * *}
  jwt:
    secret: ${ACCESMED_JWT_SECRET}
    expiration-minutes: ${ACCESMED_JWT_EXPIRATION_MINUTES:30}
  # Bootstrap del primer SuperAdmin (ver SuperAdminInicializador). Sin contraseña no se crea.
  superadmin:
    mail: ${ACCESMED_SUPERADMIN_MAIL:superadmin@accesmed.com}
    password: ${ACCESMED_SUPERADMIN_PASSWORD:}
  # Acceso a Swagger UI y /v3/api-docs (HTTP Basic, ver SecurityFilterChainConfig). Usuario
  # propio de la documentación, no del sistema. Sin contraseña la app no arranca.
  docs:
    username: ${ACCESMED_DOCS_USERNAME:accesmed}
    password: ${ACCESMED_DOCS_PASSWORD}
  # Canal chatbot (Chatwoot -> back -> Flowise). Ver Docs/Features/Chatbot.md.
  # Clave que Flowise manda en `X-Agente-Api-Key` a /accesmed-api/Agente/** (ver SecurityFilterChainConfig).
  # Sin clave la app no arranca: dejaría el canal del agente abierto.
  agente:
    api-key: ${ACCESMED_AGENTE_API_KEY}
    # Búsqueda por parecido del canal: similitud mínima de trigramas del fallback (0 a 1). Con 0.35
    # "Bilardo" devolvía a "Ricardo Molina" (Docs/Diseno-Chatbot.md §4.5).
    busqueda:
      umbral-similitud: 0.5
    # Verificación de las respuestas del agente contra la base (Docs/Diseno-Chatbot.md §4.3). En false el
    # endpoint da todo por verdadero sin consultar: interruptor por si en staging da falsos positivos.
    verificacion:
      habilitada: true
  # API de Chatwoot: el back responde por ella los mensajes del bot. El secret del webhook firma
  # los eventos del Agent Bot; vacío = no se verifica la firma (solo para probar la integración).
  chatwoot:
    base-url: ${ACCESMED_CHATWOOT_BASE_URL:https://chat.accesmed.site}
    account-id: ${ACCESMED_CHATWOOT_ACCOUNT_ID:1}
    api-token: ${ACCESMED_CHATWOOT_API_TOKEN}
    webhook-secret: ${ACCESMED_CHATWOOT_WEBHOOK_SECRET:}
    # Agrupación de mensajes en ráfaga por conversación (Docs/Features/Chatbot.md §6.C).
    agrupacion:
      espera-segundos: 4
      espera-maxima-segundos: 15
      max-mensajes: 5
    # Ventana de inactividad por conversación: abre la bienvenida y la sesión de Flowise
    # (Docs/Diseno-Chatbot.md §2.3.4).
    ventana-inactividad-minutos: 30
    # Antispam: más de max-mensajes en ventana-segundos silencia la conversación (§2.3.6).
    antispam:
      max-mensajes: 10
      ventana-segundos: 60
      silencio-minutos: 5
    # Respuestas fuera de tema seguidas que derivan la conversación a una persona.
    fuera-de-tema:
      max-seguidos: 3
  # Flowise: chatflow del agente al que el back le pasa cada mensaje del paciente.
  flowise:
    base-url: ${ACCESMED_FLOWISE_BASE_URL:http://accesmed-flowise:3000}
    chatflow-id: ${ACCESMED_FLOWISE_CHATFLOW_ID}
    api-key: ${ACCESMED_FLOWISE_API_KEY:}
    # Timeouts del cliente de Flowise. Al vencer la lectura el canal deriva la conversacion a una persona
    # (Docs/Diseno-Chatbot.md 4.8); en el flow, el timeout del modelo va por debajo de este.
    timeout-conexion-segundos: 5
    timeout-lectura-segundos: 60
  # OpenAI: transcripcion de los audios del paciente y voz de la respuesta (Docs/Diseno-Chatbot.md 5).
  # La api-key es opcional: vacia = audio apagado (el canal sigue solo con texto).
  openai:
    base-url: ${ACCESMED_OPENAI_BASE_URL:https://api.openai.com}
    api-key: ${ACCESMED_OPENAI_API_KEY:}
  # Audio del canal: modelos, voz y limites. respuesta-con-texto: true = la nota de voz va seguida del
  # mismo texto (recomendado: codigos, horarios y montos de oido se pierden); false = solo la nota de voz.
  audio:
    modelo-transcripcion: gpt-4o-mini-transcribe
    modelo-voz: gpt-4o-mini-tts
    voz: coral
    instrucciones-voz: Hablá en español rioplatense, con un tono cálido y profesional, a un ritmo pausado y claro.
    max-bytes: 10485760
    timeout-segundos: 30
    respuesta-con-texto: true
    # Carpeta de las notas de voz pregrabadas (bienvenida, espera, despedida, derivacion, audio-no-entendido,
    # audio-largo). Opcional: sin la carpeta o sin un archivo, ese mensaje sale solo en texto.
    fijos-dir: ${ACCESMED_AUDIO_FIJOS_DIR:./audios}
