# Perfil `test`: aporta únicamente las properties que el contexto de Spring necesita para
# levantar en los tests y que no están en application.yml (viven en los perfiles dev/staging/
# prod, que los tests no activan). El datasource NO se declara acá: lo autoconfigura
# Testcontainers vía @ServiceConnection (ver TestcontainersConfiguration).
spring:
  mail:
    username: test@accesmed.local
    password: test-password

accesmed:
  cors:
    allowed-origins: http://localhost:5173
  frontend:
    base-url: http://localhost:5173
  jwt:
    secret: test-jwt-secret-solo-para-tests-no-usar-en-produccion-1234567890
    expiration-minutes: 30
  docs:
    username: docs-test
    password: docs-test-password
  agente:
    api-key: test-agente-api-key
  chatwoot:
    base-url: http://localhost:9
    account-id: 1
    api-token: test-chatwoot-token
    webhook-secret: ''
  flowise:
    base-url: http://localhost:9
    chatflow-id: test-chatflow-id
    api-key: ''
